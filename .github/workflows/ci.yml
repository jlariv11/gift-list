
name: Gift List CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: giftlist_test

        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      POSTGRES_PRISMA_URL: postgresql://postgres:postgres@localhost:5432/giftlist_test
      AUTH0_DOMAIN: example.auth0.com
      AUTH0_AUDIENCE: https://giftlist-test-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push schema to test database
        run: npx prisma db push

      - name: Verify environment variables
        run: |
          node -e "console.log('AUTH0_DOMAIN set:', !!process.env.AUTH0_DOMAIN)"
          node -e "console.log('AUTH0_AUDIENCE set:', !!process.env.AUTH0_AUDIENCE)"

      - name: Run tests
        run: npm test

      - name: Run tests
        run: npx vitest run

      - name: Build backend
        run: npm run build
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
