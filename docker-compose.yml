services:
  backend:
    build:
      context: ./backend
    container_name: gift-list-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend/src:/app/src
    command: npm run dev
    environment:
      POSTGRES_PRISMA_URL: postgresql://postgres:postgres@database:5432/giftlist
    env_file:
      - ./backend/.env

    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17
    container_name: gift-list-database

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: giftlist

    ports:
      - "5432:5432"

    volumes:
      - gift-list-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d giftlist"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gift-list-postgres-data: